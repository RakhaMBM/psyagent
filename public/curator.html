<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyagent | Куратор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-dark bg-info shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold"><i class="bi bi-eyeglasses me-2"></i><span data-i18n="role.curator">Куратор</span></span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white" id="whoami"></span>
                <button class="btn btn-light btn-sm" type="button" data-action="toggleLang" title="Тіл / Язык">
                    <i class="bi bi-translate me-1"></i><span id="langLabel">KZ</span>
                </button>
                <button class="btn btn-outline-light btn-sm" data-action="logout"><i class="bi bi-box-arrow-right me-1"></i><span data-i18n="common.logout">Выход</span></button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="noGroup" class="alert alert-warning d-none">
            <i class="bi bi-exclamation-triangle me-2"></i><span data-i18n="curator.no_group">Вам не назначена группа. Обратитесь к психологу колледжа.</span>
        </div>

        <h4 class="mb-3"><i class="bi bi-people me-2"></i><span data-i18n="table.group">Группа</span>: <span id="groupName" class="text-info"></span></h4>

        <!-- Студенты -->
        <div class="card mb-4">
            <div class="card-header bg-white"><h6 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i><span data-i18n="nav.students">Студенты</span></h6></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th data-i18n="table.fio">ФИО</th>
                                <th data-i18n="table.birth_date">Дата рождения</th>
                                <th data-i18n="table.age">Возраст</th>
                                <th data-i18n="table.school">Школа</th>
                                <th data-i18n="common.actions">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="studentsBody">
                            <tr><td colspan="5" class="text-center py-3 text-muted" data-i18n="common.loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Результаты -->
        <div class="card">
            <div class="card-header bg-white"><h6 class="mb-0"><i class="bi bi-graph-up me-2"></i><span data-i18n="results.title">Результаты диагностики</span></h6></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th data-i18n="table.student">Студент</th>
                                <th data-i18n="table.test">Тест</th>
                                <th data-i18n="table.score">Балл</th>
                                <th data-i18n="table.date">Дата</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <tr><td colspan="4" class="text-center py-3 text-muted" data-i18n="common.loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
    <script src="methodologies.js"></script>
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="pdf-download.js"></script>
    <script src="event-actions.js"></script>
    <script src="curator.js"></script>
</body>
</html>
