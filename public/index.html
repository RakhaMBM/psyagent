<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyagent | Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="login-page">
    <button class="btn btn-light btn-sm position-absolute top-0 end-0 m-3 shadow-sm" type="button" onclick="toggleLang()" title="Тіл / Язык" style="z-index:10;">
        <i class="bi bi-translate me-1"></i><span id="langLabel">KZ</span>
    </button>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Логотип -->
                        <div class="text-center mb-4">
                            <div class="logo-circle mb-3">
                                <i class="bi bi-clipboard2-pulse fs-1"></i>
                            </div>
                            <h2 class="fw-bold text-primary">Psyagent</h2>
                            <p class="text-muted" data-i18n="login.subtitle">Вход</p>
                        </div>

                        <!-- Форма входа -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="college" class="form-label" data-i18n="login.college">Код колледжа</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" class="form-control" id="college" data-i18n-ph="login.college_ph" placeholder="Оставьте пустым для входа по умолчанию" autocomplete="off">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label" data-i18n="login.username">Логин</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" data-i18n-ph="login.username_ph" placeholder="Введите логин" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label" data-i18n="login.password">Пароль</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" data-i18n-ph="login.password_ph" placeholder="Введите пароль" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="errorMsg" class="alert alert-danger d-none"></div>

                            <button type="submit" class="btn btn-primary w-btn py-2 mb-3" id="loginBtn">
                                <span class="btn-text" data-i18n="login.submit">Войти</span>
                                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center text-muted small">
                            <p data-i18n="login.rights">© 2026 Psyagent. Все права защищены.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="i18n.js"></script>
    <script>
        // Показать/скрыть пароль
        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Обработка входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const spinner = btn.querySelector('.spinner-border');
            const btnText = btn.querySelector('.btn-text');
            const errorMsg = document.getElementById('errorMsg');

            // Показываем загрузку
            spinner.classList.remove('d-none');
            btnText.textContent = t('login.logging_in');
            btn.disabled = true;
            errorMsg.classList.add('d-none');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        college: document.getElementById('college').value.trim()
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || t('login.error'));
                }

                // Сохраняем токен
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Перенаправление по роли
                redirectByRole(data.user.role);

            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('d-none');
                
                // Сбрасываем кнопку
                spinner.classList.add('d-none');
                btnText.textContent = t('login.submit');
                btn.disabled = false;
            }
        });

        // Проверяем авторизацию при загрузке
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                redirectByRole(JSON.parse(user).role);
            }
        });

        function redirectByRole(role) {
            if (role === 'super_admin') window.location.href = '/platform';
            else if (role === 'admin') window.location.href = '/admin';
            else if (role === 'curator') window.location.href = '/curator';
            else window.location.href = '/student';
        }
    </script>
</body>
</html>
