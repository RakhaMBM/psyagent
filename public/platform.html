<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyagent | Платформа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold"><i class="bi bi-buildings me-2"></i>Psyagent — Платформа</span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white-50 small" id="whoami"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Выйти</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <!-- Список колледжей -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-list-ul me-2"></i>Колледжи</h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Код</th><th>Название</th><th>БД</th>
                                        <th class="text-center">Студентов</th><th class="text-center">Статус</th>
                                    </tr>
                                </thead>
                                <tbody id="tenantsTable">
                                    <tr><td colspan="5" class="text-center text-muted py-4">Загрузка…</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Сброс пароля пользователя (поддержка) -->
            <div class="col-12">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-key me-2"></i>Сброс пароля пользователя <span class="text-muted small">(поддержка)</span></h5>
                        <div class="row g-2 align-items-end mb-3">
                            <div class="col-md-4">
                                <label class="form-label small mb-1">Колледж</label>
                                <select class="form-select" id="supportTenant">
                                    <option value="">— выберите колледж —</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small mb-1">Поиск пользователя</label>
                                <input type="text" class="form-control" id="supportSearch" placeholder="ФИО или логин">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-outline-primary w-100" onclick="loadTenantUsers()"><i class="bi bi-search me-1"></i>Найти</button>
                            </div>
                        </div>
                        <div id="supportMsg"></div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Группа</th><th class="text-end">Действие</th></tr>
                                </thead>
                                <tbody id="supportUsers">
                                    <tr><td colspan="5" class="text-center text-muted py-3">Выберите колледж</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Создание колледжа -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Новый колледж</h5>
                        <div id="formMsg"></div>
                        <form id="createForm">
                            <div class="mb-3">
                                <label class="form-label">Код колледжа <span class="text-muted small">(латиница/цифры)</span></label>
                                <input type="text" class="form-control" id="code" placeholder="college2" required pattern="[a-zA-Z0-9_]+">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Название</label>
                                <input type="text" class="form-control" id="name" placeholder="Второй колледж" required>
                            </div>
                            <hr>
                            <p class="text-muted small mb-2">Первый администратор-психолог колледжа:</p>
                            <div class="mb-3">
                                <label class="form-label">ФИО администратора</label>
                                <input type="text" class="form-control" id="adminFullName" placeholder="Иванова И.И.">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Логин администратора</label>
                                <input type="text" class="form-control" id="adminUsername" placeholder="admin" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль администратора <span class="text-muted small">(мин. 8)</span></label>
                                <input type="text" class="form-control" id="adminPassword" minlength="8" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="createBtn">
                                <span class="btn-text">Создать колледж</span>
                                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        // Доступ только для супер-админа
        if (!token || !user || user.role !== 'super_admin') {
            window.location.href = '/';
        } else {
            document.getElementById('whoami').textContent = user.fullName || user.username;
        }

        const authHeaders = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function loadTenants() {
            try {
                const res = await fetch('/api/platform/tenants', { headers: authHeaders });
                if (res.status === 401 || res.status === 403) return logout();
                const list = await res.json();
                // Заполняем выпадающий список колледжей для панели поддержки
                const sel = document.getElementById('supportTenant');
                const prev = sel.value;
                sel.innerHTML = '<option value="">— выберите колледж —</option>' +
                    (Array.isArray(list) ? list.map(t => `<option value="${t.id}">${esc(t.name)} (${esc(t.code)})</option>`).join('') : '');
                if (prev) sel.value = prev;

                const tbody = document.getElementById('tenantsTable');
                if (!Array.isArray(list) || list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Нет колледжей</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(t => `
                    <tr>
                        <td><code>${esc(t.code)}</code></td>
                        <td>${esc(t.name)}</td>
                        <td class="small text-muted">${esc(t.db_name)}</td>
                        <td class="text-center">${t.student_count == null ? '—' : t.student_count}</td>
                        <td class="text-center">
                            ${t.is_active
                                ? '<span class="badge bg-success">активен</span>'
                                : '<span class="badge bg-secondary">отключён</span>'}
                        </td>
                    </tr>`).join('');
            } catch (e) {
                document.getElementById('tenantsTable').innerHTML =
                    '<tr><td colspan="5" class="text-center text-danger py-4">Ошибка загрузки</td></tr>';
            }
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createBtn');
            const spinner = btn.querySelector('.spinner-border');
            const msg = document.getElementById('formMsg');
            spinner.classList.remove('d-none');
            btn.disabled = true;
            msg.innerHTML = '';
            try {
                const res = await fetch('/api/platform/tenants', {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify({
                        code: document.getElementById('code').value.trim(),
                        name: document.getElementById('name').value.trim(),
                        adminFullName: document.getElementById('adminFullName').value.trim(),
                        adminUsername: document.getElementById('adminUsername').value.trim(),
                        adminPassword: document.getElementById('adminPassword').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка создания');
                msg.innerHTML = `<div class="alert alert-success py-2">Колледж <b>${esc(data.code)}</b> создан (БД: ${esc(data.db_name)})</div>`;
                e.target.reset();
                loadTenants();
            } catch (err) {
                msg.innerHTML = `<div class="alert alert-danger py-2">${esc(err.message)}</div>`;
            } finally {
                spinner.classList.add('d-none');
                btn.disabled = false;
            }
        });

        const roleLabel = (r) => ({ admin: 'Психолог', curator: 'Куратор', student: 'Студент' }[r] || r);

        async function loadTenantUsers() {
            const tenantId = document.getElementById('supportTenant').value;
            const tbody = document.getElementById('supportUsers');
            document.getElementById('supportMsg').innerHTML = '';
            if (!tenantId) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Выберите колледж</td></tr>';
                return;
            }
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Загрузка…</td></tr>';
            try {
                const search = encodeURIComponent(document.getElementById('supportSearch').value.trim());
                const res = await fetch(`/api/platform/tenants/${tenantId}/users?search=${search}`, { headers: authHeaders });
                if (res.status === 401 || res.status === 403) return logout();
                const users = await res.json();
                if (!Array.isArray(users) || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Пользователи не найдены</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>${esc(u.full_name)}${u.is_active ? '' : ' <span class="badge bg-secondary">отключён</span>'}</td>
                        <td><code>${esc(u.username)}</code></td>
                        <td>${esc(roleLabel(u.role))}</td>
                        <td class="small text-muted">${esc(u.group_name || '—')}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger" onclick="resetUserPassword(${tenantId}, ${u.id}, '${esc(u.username).replace(/'/g, "\\'")}')">
                                <i class="bi bi-key me-1"></i>Сбросить пароль
                            </button>
                        </td>
                    </tr>`).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-3">Ошибка загрузки</td></tr>';
            }
        }

        async function resetUserPassword(tenantId, userId, username) {
            const newPassword = prompt(`Новый пароль для «${username}» (минимум 8 символов):`);
            if (newPassword == null) return;
            if (newPassword.length < 8) {
                alert('Пароль должен быть не короче 8 символов');
                return;
            }
            try {
                const res = await fetch('/api/platform/reset-password', {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify({ tenantId, userId, newPassword })
                });
                const data = await res.json();
                const msg = document.getElementById('supportMsg');
                if (!res.ok) throw new Error(data.error || 'Ошибка');
                msg.innerHTML = `<div class="alert alert-success py-2">${esc(data.message)}</div>`;
            } catch (err) {
                document.getElementById('supportMsg').innerHTML = `<div class="alert alert-danger py-2">${esc(err.message)}</div>`;
            }
        }

        document.getElementById('supportTenant').addEventListener('change', loadTenantUsers);

        loadTenants();
    </script>
</body>
</html>
