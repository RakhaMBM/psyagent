<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Диагностика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-person-badge me-2"></i><span data-i18n="student.brand">Личный кабинет</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50" id="studentInfo"></span>
                <button class="btn btn-outline-light btn-sm" type="button" onclick="toggleLang()" title="Тіл / Язык">
                    <i class="bi bi-translate me-1"></i><span id="langLabel">KZ</span>
                </button>
                <button class="btn btn-outline-light btn-sm" onclick="logout()" data-i18n="common.logout">Выход</button>
            </div>
        </div>
    </nav>

    <main class="content-wrapper pt-5 mt-5 p-4">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card profile-card">
                    <div class="card-body text-center">
                        <div class="avatar-large mb-3">
                            <i class="bi bi-person-circle display-1"></i>
                        </div>
                        <h4 id="profileName" class="mb-1">...</h4>
                        <p class="text-muted mb-2" id="profileGroup"></p>
                        <span class="badge bg-success" id="profileAge"></span>

                        <hr>

                        <div class="text-start small">
                            <div class="mb-2"><strong data-i18n="student.lbl_email">Email</strong>: <span id="profileEmail">-</span></div>
                            <div class="mb-2"><strong data-i18n="student.lbl_phone">Телефон</strong>: <span id="profilePhone">-</span></div>
                            <div class="mb-2"><strong data-i18n="student.lbl_school">Школа</strong>: <span id="profileSchool">-</span></div>
                            <div><strong data-i18n="student.lbl_address">Адрес</strong>: <span id="profileAddress">-</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h6 class="mb-0"><i class="bi bi-file-earmark-person me-2"></i><span data-i18n="student.my_form">Моя анкета</span></h6>
                        <button class="btn btn-sm btn-outline-primary" onclick="openProfileModal()">
                            <i class="bi bi-pencil me-1"></i><span data-i18n="student.edit">Редактировать</span>
                        </button>
                    </div>
                    <div class="card-body" id="profileInfo">
                        <p class="text-muted text-center" data-i18n="student.form_empty">Анкета не заполнена</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white">
                        <h6 class="mb-0"><i class="bi bi-journal-check me-2"></i><span data-i18n="student.assigned_tests">Назначенные тесты</span></h6>
                    </div>
                    <div class="card-body" id="testsContainer">
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-inbox display-4 d-block mb-2"></i>
                            <p data-i18n="student.loading_tests">Загрузка тестов...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="profileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" data-i18n="pmodal.title">Заполнение анкеты</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="profileForm">
                    <div class="modal-body">
                        <h6 class="text-primary border-bottom pb-2 mb-3" data-i18n="pmodal.family">Семейные данные</h6>

                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="pmodal.family_type">Тип семьи</span> *</label>
                            <select class="form-select" name="family_type" required>
                                <option value="" data-i18n="pmodal.choose">Выберите...</option>
                                <option value="full" data-i18n="family.full">Полная</option>
                                <option value="single_parent" data-i18n="family.single_parent">Неполная</option>
                                <option value="guardian" data-i18n="family.guardian">Опека</option>
                                <option value="other" data-i18n="family.other">Другое</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="pmodal.lives_with">С кем проживаете?</label>
                            <input type="text" class="form-control" name="lives_with"
                                   data-i18n-ph="pmodal.lives_with_ph" placeholder="Например: мама, бабушка, старший брат...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="pmodal.school">Школа окончания</label>
                            <input type="text" class="form-control" name="school" placeholder="№123 г. Алматы">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" data-i18n="pmodal.address">Домашний адрес</label>
                            <input type="text" class="form-control" name="home_address" placeholder="ул. Примерная, д. 1, кв. 2">
                        </div>

                        <div class="alert alert-info small">
                            <i class="bi bi-lock me-1"></i>
                            <span data-i18n="pmodal.privacy">Все данные конфиденциальны и доступны только педагогу-психологу.</span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Отмена</button>
                        <button type="submit" class="btn btn-primary" data-i18n="common.save">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="testTitle">...</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="testQuestions">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="test.close">Закрыть</button>
                    <button type="button" class="btn btn-primary" onclick="saveAndClose()" data-i18n="test.save_draft">
                        Сохранить черновик
                    </button>
                    <button type="button" class="btn btn-success" onclick="completeTest()">
                        <i class="bi bi-check-lg me-1"></i><span data-i18n="test.finish">Завершить тест</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="i18n.js"></script>
    <script>
        let token = localStorage.getItem('token');
        let currentUser = JSON.parse(localStorage.getItem('user'));
        let currentResultId = null;
        let currentQuestionnaireId = null;

        if (!token || currentUser?.role !== 'student') {
            window.location.href = '/';
        }

        window.onLangChange = function () {
            loadUserInfo();
        };

        async function loadUserInfo() {
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    throw new Error('Ошибка загрузки');
                }

                const user = await res.json();

                document.getElementById('studentInfo').textContent = user.full_name;
                document.getElementById('profileName').textContent = user.full_name;
                document.getElementById('profileGroup').textContent = user.group_name || '';
                document.getElementById('profileAge').textContent = user.age ? `${user.age} ${t('unit.years')}` : '';
                document.getElementById('profileEmail').textContent = user.email || '-';
                document.getElementById('profilePhone').textContent = user.phone || '-';
                document.getElementById('profileSchool').textContent = user.school || '-';
                document.getElementById('profileAddress').textContent = user.home_address || '-';

                loadProfile();
                loadMyTests();

            } catch (e) {
                console.error(e);
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const profile = await res.json();

                const info = document.getElementById('profileInfo');
                if (profile) {
                    const familyKeys = { full: 'family.full', single_parent: 'family.single_parent', guardian: 'family.guardian', other: 'family.other' };
                    const familyLabel = familyKeys[profile.family_type] ? t(familyKeys[profile.family_type]) : '-';
                    info.innerHTML = `
                        <div class="row">
                            <div class="col-6"><strong>${t('profile.family_type')}:</strong> ${familyLabel}</div>
                            <div class="col-6"><strong>${t('profile.lives_with')}:</strong> ${profile.lives_with || '-'}</div>
                            <div class="col-6"><strong>${t('profile.school')}:</strong> ${profile.school || '-'}</div>
                            <div class="col-6"><strong>${t('profile.address')}:</strong> ${profile.home_address || '-'}</div>
                        </div>
                    `;
                } else {
                    info.innerHTML = `<p class="text-muted text-center">${t('student.form_empty')}</p>`;
                }
            } catch (e) {}
        }

        function openProfileModal() {
            new bootstrap.Modal(document.getElementById('profileModal')).show();
        }

        document.getElementById('profileForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());

            try {
                const res = await fetch('/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('profileModal')).hide();
                    loadProfile();
                    alert(t('msg.form_saved'));
                }
            } catch (e) {
                alert(t('msg.save_error'));
            }
        });

        async function loadMyTests() {
            try {
                const res = await fetch('/api/my-tests', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error);
                }

                const testsRaw = await res.json();
                const tests = Array.isArray(testsRaw) ? testsRaw : (testsRaw?.data || []);

                const container = document.getElementById('testsContainer');

                if (tests.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-inbox display-4 d-block mb-2"></i>
                            <p>${t('student.no_tests')}</p>
                            <small class="text-muted">${t('student.no_tests_hint')}</small>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="list-group">
                        ${tests.map(item => `
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="mb-1">${item.title}</h6>
                                    <small class="text-muted">
                                        ${item.questions_count || '?'} ${t('tests.q_count')}
                                        ${item.due_date ? `| ${t('msg.due')}: ${formatDate(item.due_date)}` : ''}
                                    </small>
                                </div>
                                <div>
                                    ${getStatusBadge(item.assignment_status, item.result_status)}
                                    ${item.result_status !== 'completed' ? `
                                        <button class="btn btn-sm btn-primary ms-2" onclick="startTest(${item.id}, '${(item.title || '').replace(/'/g, "\\'")}')">
                                            ${item.result_status === 'in_progress' ? t('test.continue') : t('test.start')}
                                        </button>
                                    ` : `
                                        <span class="badge bg-success ms-2">${t('test.passed')}</span>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                document.getElementById('testsContainer').innerHTML = `
                    <div class="alert alert-danger">${t('msg.tests_load_error')}: ${e.message}</div>
                `;
            }
        }

        function getStatusBadge(assignStatus, resultStatus) {
            if (resultStatus === 'completed') return `<span class="badge bg-success">${t('st.completed')}</span>`;
            if (assignStatus === 'started' || resultStatus === 'in_progress') return `<span class="badge bg-warning text-dark">${t('st.in_progress')}</span>`;
            return `<span class="badge bg-secondary">${t('st.assigned')}</span>`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleDateString(getLang() === 'kz' ? 'kk-KZ' : 'ru-RU');
        }

        async function startTest(questionnaireId, title) {
            currentQuestionnaireId = questionnaireId;
            document.getElementById('testTitle').textContent = title;

            try {
                const startRes = await fetch('/api/results/start', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ questionnaireId })
                });

                const startData = await startRes.json();
                currentResultId = startData.resultId;

                const qRes = await fetch(`/api/questionnaires/${questionnaireId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const questionnaire = await qRes.json();

                renderQuestions(questionnaire.questions);
                new bootstrap.Modal(document.getElementById('testModal')).show();

            } catch (e) {
                alert(t('msg.error') + ': ' + e.message);
            }
        }

        function renderQuestions(questions) {
            const questionsArray = Array.isArray(questions) ? questions : [];

            const container = document.getElementById('testQuestions');

            container.innerHTML = questionsArray.map((q, idx) => {
                let inputHtml = '';

                switch (q.question_type) {
                    case 'single':
                        inputHtml = `
                            <div class="mt-2">
                                ${(q.options || []).map((opt, i) => `
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio"
                                               name="q_${idx}" id="q${idx}_opt${i}" value="${opt}">
                                        <label class="form-check-label" for="q${idx}_opt${i}">${opt}</label>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;

                    case 'multiple':
                        inputHtml = `
                            <div class="mt-2">
                                ${(q.options || []).map((opt, i) => `
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox"
                                               name="q_${idx}[]" id="q${idx}_opt${i}" value="${opt}">
                                        <label class="form-check-label" for="q${idx}_opt${i}">${opt}</label>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;

                    case 'scale':
                        inputHtml = `
                            <div class="mt-3">
                                <div class="d-flex justify-content-between small text-muted mb-1">
                                    <span>${(q.scaleLabels?.min || q.scale_min) || 1}</span>
                                    <span>${(q.scaleLabels?.max || q.scale_max) || 5}</span>
                                </div>
                                <input type="range" class="form-range" name="q_${idx}"
                                       min="${q.scale_min || 1}" max="${q.scale_max || 5}" value="3">
                                <div class="text-center"><strong id="scaleVal_${idx}">3</strong></div>
                            </div>
                        `;
                        break;

                    case 'text':
                        inputHtml = `
                            <div class="mt-2">
                                <textarea class="form-control" name="q_${idx}" rows="3"
                                          placeholder="${t('test.answer_ph')}"></textarea>
                            </div>
                        `;
                        break;
                }

                return `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h6 class="card-title">
                                <span class="badge bg-primary me-2">${idx + 1}</span>
                                ${q.question_text}
                                ${q.is_required ? '<span class="text-danger">*</span>' : ''}
                            </h6>
                            ${inputHtml}
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('input[type="range"]').forEach(range => {
                range.addEventListener('input', function () {
                    const idx = this.name.split('_')[1];
                    document.getElementById(`scaleVal_${idx}`).textContent = this.value;
                });
            });
        }

        function collectAnswers() {
            const answers = {};
            const form = document.getElementById('testQuestions');

            form.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
                const idx = radio.name.split('_')[1];
                answers[idx] = radio.value;
            });

            form.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const idx = cb.name.split('_')[1].replace('[]', '');
                if (!answers[idx]) answers[idx] = [];
                if (cb.checked) answers[idx].push(cb.value);
            });

            form.querySelectorAll('input[type="range"]').forEach(range => {
                const idx = range.name.split('_')[1];
                answers[idx] = parseInt(range.value);
            });

            form.querySelectorAll('textarea').forEach(ta => {
                const idx = ta.name.split('_')[1];
                answers[idx] = ta.value;
            });

            return answers;
        }

        async function saveAndClose() {
            if (!currentResultId) return;

            const answers = collectAnswers();

            try {
                await fetch('/api/results/save', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ resultId: currentResultId, answers })
                });

                bootstrap.Modal.getInstance(document.getElementById('testModal')).hide();
                loadMyTests();
                alert(t('msg.draft_saved'));
            } catch (e) {
                alert(t('msg.save_error'));
            }
        }

        async function completeTest() {
            if (!currentResultId) return;

            if (!confirm(t('msg.confirm_finish'))) {
                return;
            }

            const answers = collectAnswers();

            try {
                const res = await fetch('/api/results/complete', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ resultId: currentResultId, answers })
                });

                const data = await res.json();

                bootstrap.Modal.getInstance(document.getElementById('testModal')).hide();
                loadMyTests();

                alert('✅ ' + t('msg.test_finished') + '\n\n' + t('msg.your_result') + ': ' + data.score + '\n\n' + t('msg.thanks'));
            } catch (e) {
                alert(t('msg.error') + ': ' + e.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        loadUserInfo();
    </script>
</body>
</html>
